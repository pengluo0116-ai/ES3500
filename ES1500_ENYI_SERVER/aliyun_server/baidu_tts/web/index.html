<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml">
<head runat="server">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <title>语音解析</title>
    <link href="css/tts.css" rel="stylesheet" type="text/css" />
    <script src="js/jquery-1.8.3.min.js" type="text/javascript"></script>
    <script src="js/layer/layer.js" type="text/javascript"></script>
    <script src="js/layer/extend/layer.ext.js" type="text/javascript"></script>
    <!--[if lt IE 9]>
    <script src="js/json/json2.js" type="text/javascript"></script>
    <![endif]-->
    <script src="js/JS.js" type="text/javascript"></script>
</head>
<body>
    <form enctype="multipart/form-data" onsubmit="return smb_check()" method="POST" action="/cgi-bin/upload">
    <div class="head_by">
        <!--# include file="/topnav/topnav.html" --> 
    </div>
    <div class="body_by">
        <div class="zc_title">在线获取语音包</div>
        <div class="zc_by">
            <div class="zc_lift">
                <table class="zc_tb" style="margin-bottom:30px;" border="0" cellpadding="0" cellspacing="0">
                    <tr>
                        <td class="zc_td1"></td>
                        <td class="zc_td2"></td>
                        <td class="zc_td3">
                            <a href="javascript:;" class="a-upload">
                                <input type="file" id="u_file" name="userfile" />点击上传语音配置文件
                            </a>
                        </td>
                        <td class="zc_td4"></td>
                    </tr>
                    <tr>
                        <td class="zc_td1"></td>
                        <td class="zc_td2"></td>
                        <td class="zc_td3_zc" id="ufileName">选择语音配置文件...</td>
                        <td class="zc_td4"></td>
                    </tr>
                </table>
                <table class="zc_tb" border="0" cellpadding="0" cellspacing="0">
                    <tr>
                        <td class="zc_td1"></td>
                        <td class="zc_td2"></td>
                        <td class="zc_td3" ><input type="submit" value="提交" style="width:150px; line-height:24px;" /></td>
                        <td class="zc_td4"></td>
                    </tr>
                    <tr>
                        <td class="zc_td1"></td>
                        <td class="zc_td2"></td>
                        <td class="zc_td3">我已读取<a href="#">《在线获取语音包》</a></td>
                        <td class="zc_td4"></td>
                    </tr>
                </table>
            </div>
            <div class="zc_right">
                <div class="zc_right_d">测试版本</div>
            </div>
        </div>
    </div>
    </form>
</body>
</html>

<script type="text/javascript">

function tts_check(){
    var filePath=$("#u_file").val();
    if(filePath.indexOf("conf")!=-1 || filePath.indexOf("CONF")!=-1){
        var arr=filePath.split('\\');
        var fileName=arr[arr.length-1];
        $("#ufileName").html(fileName);
        $("#ufileName").attr("style", "color:green;");
        return true;
    }else{
        $("#ufileName").html("");
        $("#ufileName").html("您未上传文件，或者您上传文件类型有误！");
        $("#ufileName").attr("style", "color:red;");
        return false 
    }
}

$(".a-upload").on("change","input[type='file']",  tts_check);

function smb_check(){
    if(!tts_check()) return false;
    $("#ufileName").html("可能需要花费较长时间(不超过120秒),请耐心等待..."); return true;
}

</script>
