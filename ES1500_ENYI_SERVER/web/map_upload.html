<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
        <link href="css/css.css" rel="stylesheet" type="text/css" />
        <script src="js/jquery-1.8.3.min.js" type="text/javascript"></script>
        <script src="js/JS.js" type="text/javascript"></script>
        <script src="js/js_display.js" type="text/javascript"></script>
        <!--[if lt IE 9]>
            <script src="js/json/json2.js" type="text/javascript"></script>
        <![endif]-->
        <script src="js/layer/layer.js" type="text/javascript"></script>
        <script src="js/layer/extend/layer.ext.js" type="text/javascript"></script>
        <style type="text/css">
            .msg_tr { height:auto; padding-bottom: 20px;}
            #dev_list{ border-top-width: 0; }
            .a-upload {
                padding: 4px 10px;
                height: 20px;
                line-height: 20px;
                position: relative;
                cursor: pointer;
                color: #888;
                background: #fafafa;
                border: 1px solid #ddd;
                border-radius: 4px;
                overflow: hidden;
                display: inline-block;
                *display: inline;
                *zoom: 1
            }

            .a-upload  input {
                position: absolute;
                font-size: 100px;
                right: 0;
                top: 0;
                opacity: 0;
                filter: alpha(opacity=0);
                cursor: pointer
            }

            .a-upload:hover {
                color: #444;
                background: #eee;
                border-color: #ccc;
                text-decoration: none
            }
            .bd{ width: 400px; height: 120px; margin: 0 auto 0 auto; }
            #mmsg{ line-height: 30px; margin: 10px auto 10px auto; text-align: center; }
            .note{ font-size: 12px; text-align: center; color: red; }
        </style>
</head>
<body>
    <div class="bd">
        <form enctype="multipart/form-data" onsubmit="return smb_check()" action="/cgi-bin/mapupload.cgi" method="POST">
        <center>
        <a href="javascript:;" class="a-upload"><input type="file" id="u_file" name="userfile" accept="image/*" />点击上传地图图片</a>
        <div id="mmsg">选择上传的文件</div>
        <input type="submit" value="上传图片" />
        <div class="note">上传图片后，需要重新设置所有设备的位置</div>
        </center>
        </form>
    </div>
</body>
</html>

<script type="text/javascript">

$(document).ready(function(){
    $(".a-upload").on("change","input[type='file']", img_check);
});

/*
    函数名称：img_check
    函数功能：校验上传文件格式
    传入参数：无
    传出数据：true 正确 false 错误
    注意事项：无
    编写人员：王凤龙
    编写时间：2017-05-25
*/
function img_check(){
    $("#mmsg").css("color", "black");

    var filePath = trimStr($("#u_file").val());

    if(filePath=="" || filePath.length<=0x00){ 
        $("#mmsg").css("color", "red");
        $("#mmsg").html("未选择文件"); 
        return false;
    }

    $("#mmsg").css("color", "green");
    $("#mmsg").html(filePath);
    return true;
}

function smb_check(){
    if(!img_check()) return false;
    $("#mmsg").html("上传可能需要花费较长时间，请耐心等待"); return true;
}

</script>
