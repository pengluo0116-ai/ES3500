    var l_time;
    function getLinuxTime()
    {
        var postJson = {};
        postJson["display"] = 4;
        var _load = layer.load();
        var tm_sec;
        $.post(
            "cgi-bin/set.cgi",
            JSON.stringify(postJson),
            function(data, status){
                layer.close(_load);
                if (status != "success") { layer.alert("连接服务器失败"); return; }
                var temp = eval('(' + data + ')');

                switch (parseInt(temp.error)) {
                    case 399:
                        layer.alert("操作失败，登录超时", function (_index) { location.href = 'login.html'; }); return;
                    case 0: break;
                    default: layer.alert(temp.data); return;
                }
                tm_sec = temp.time;
                l_time = Math.round(tm_sec);
                timer.innerHTML=new Date(l_time*1000).toLocaleString();
            },
            "html");
    }

    function setSysTimer()
    {
        systimer.innerHTML=new Date().toLocaleString();

    /*
        函数名称: pt_checkoutHAND
        函数功能：检出手工校时配置数据
        传入参数：jsonConf检出的数据存储到该引用指向的存储空间

    function pt_checkoutHAND(jsonConf)
    {
        jsonConf["sync_sys_flag"] = $("#sync_sys").attr("checked") ? 1 : 0;
        if(~~jsonConf["sync_sys_flag"] == 1)
        {
            var tmpTime = new Date();
            var year = tmpTime.getFullYear();
            var month = tmpTime.getMonth()+1;
            var day = tmpTime.getDate();
            var hour = tmpTime.getHours();
            var min = tmpTime.getMinutes();
            var sec = tmpTime.getSeconds();
            jsonConf["hand_time"] = year + "-" + month + "-" + day + " " + hour + ":" + min + ":" + sec;
        }else{
            jsonConf["hand_time"] = trimStr($("#hand_time").val());
        }
        return true;
    }

    function setTime()
    {
        var postJson = {};
        postJson["display"] = 3;

        if(!pt_checkout(postJson)) return;

        var _load = layer.load();
        $.post(
            "cgi-bin/set.cgi",

                layer.close(_load);
