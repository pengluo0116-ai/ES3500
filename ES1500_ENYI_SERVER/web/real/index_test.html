<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <script type="text/javascript" src="/js/jquery-1.8.3.min.js"></script>
    <script type="text/javascript" src="/js/layer/layer.js"></script>
    <script type="text/javascript" src="/js/layer/extend/layer.ext.js"></script>
    <script type="text/javascript" src="/js/JS.js"></script>
    <!--[if lt IE 9]>
        <script src="/js/json/json2.js" type="text/javascript"></script>
    <![endif]-->
    <script type="text/javascript" src="/js/html5shiv.min.js"></script>
    <script type="text/javascript" src="/js/mqttws31.min.js"></script>
</head>
<body>
<div id="msg"></div>
</body>
</html>

<script type="text/javascript">
    $(document).ready(function(){
        mt_getClient();
    });
    
    var mt_options = {
        "client" : null,                            //MQTT客户端
        "sip" : null,                               //服务器IP
        "port": 0,                                  //服务器端口
        "topic" : "#",                              //订阅TOPIC
        "username" : null,                          //登录账号
        "userpasd" : null,                          //登录密码
        "cleanSession" : true,                      //是否清楚session
        "useTLS" : false,
        "path" : "/mqtt",
        "reconnectTimeout" : 2000,                  //重连超时时间
        "timeout" : 3                               //超时时间
    };

    /*
        函数名称：mt_getClinet
        函数功能：获取mqtt客户端配置信息
        传入参数：无
        传出数据：无
        注意事项：无
        编写人员：王凤龙
        编写时间：2017-06-20
    */
    function mt_getClient(){
        mt_options.sip = "192.168.1.123";
        mt_options.port = 9001;
        mt_options.topic = "#";

        mt_init();
    }

    /*
        函数名称：mt_init
        函数功能：创建mqtt客户端
        传入参数：无
        传出数据：无
        注意事项：无
        编写人员：王凤龙
        编写时间：2017-06-20
    */
    function mt_init(){
        /*创建客户端*/
        mt_options.client = new Paho.MQTT.Client(
            mt_options.sip,
            mt_options.port,
            mt_options.path,
            "wcl_" + parseInt(Math.random() * 100, 10)
        );

        /*参数配置*/
        mt_options.client.onConnectionLost = mt_onConnecttionLost;
        mt_options.client.onMessageArrived = mt_onMessageArrived;

        var option = {
            timeout : mt_options.timeout,
            useSSL  : mt_options.useTLS,
            cleanSession : mt_options.cleanSession,
            onSuccess :mt_onConnect,
            onFailure: function(message){
                console.log("连接服务器失败:" + message.errorMessage);
                setTimeout(mt_init, mt_options.reconnectTimeout);
            }
        };

        if(mt_options.username != null){
            option.userName = mt_options.username;
            option.userPasd = mt_options.userpasd;
        }

        /*连接服务器*/
        mt_options.client.connect(option);
    }

    /*
        函数名称：mt_onConnect
        函数功能：连接服务器成功处理
        传入参数：无
        传出数据：无
        注意事项：无
        编写人员：王凤龙
        编写时间：2017-06-20
    */
    function mt_onConnect(){
        layer.msg("连接服务器成功");
        mt_options.client.subscribe(mt_options.topic, {qos: 0});
    }

    /*
        函数名称：mt_onConnecttionLost
        函数功能：mqtt客户端连接中断处理
        传入参数：response 连接断响应消息
        传出数据：无
        注意事项：无
        编写人员：王凤龙
        编写时间：2017-06-20
    */
    function mt_onConnecttionLost(response){
        layer.msg("与服务器断开，自动尝试重新连接...");
        setTimeout(mt_getClient, mt_options.reconnectTimeout);
    }

    /*
        函数名称：mt_onMessageArrived
        函数功能：mqtt接收到数据处理
        传入参数：message    服务器返回数据
        传出数据：无
        注意事项：无
        编写人员：王凤龙
        编写时间：2017-06-20
    */
    function mt_onMessageArrived(message){
        var topic = message.destinationName;
        var payload = message.payloadString;
        console.log("topic:" + topic + " / value:" + payload);
        $("#msg").html("topic:" + topic + " / value:" + payload);
    }
</script>
