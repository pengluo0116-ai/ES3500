
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<link href="css/css.css" rel="stylesheet" type="text/css" />
<script src="js/jquery-1.8.3.min.js" type="text/javascript"></script>
    <script src="js/JS.js" type="text/javascript"></script>
<!--[if lt IE 9]>
    <script src="js/json/json2.js" type="text/javascript"></script>
<![endif]-->
<script src="js/layer/layer.js" type="text/javascript"></script>
<script src="js/layer/extend/layer.ext.js" type="text/javascript"></script>
<style type="text/css">
    body{ width: 100%; height: 100%;}
</style>
<title>cgi测试</title>
</head>
<body>
1：请输入cgi名称：<br /><input type="text" id="txt_cgi" value="" /> <br /> <br />
2：输入要上传的json字符串：<br /><input type="text" id="txt_json" style="width:500px;" value="" /> </br> 
    
    <input type="button" onclick="login()" value="提交" /><br />
    <br />

3:返回数据：<br />
<div id="d_show" style="color:red;" ></div>
</body>
</html>

<script type="text/javascript">
    /*登录操作*/
    function login() {
        $("#d_show").html("");
        
        var page = $("#txt_cgi").val();
        page = trimStr(page);
        if(page.length<=0 || page==null){ $("#d_show").html("cgi名称为空"); return; }
        
        var sendData = $("#txt_json").val();
        sendData = trimStr(sendData);
        if(sendData.length<=0 || sendData==null){ $("#d_show").html("提交json数据为空"); return; }
        
        try{ postjson = eval('(' + sendData + ')'); }catch(e){ $("#d_show").html("json数据格式有误"); return; }

        $.post(
            "cgi-bin/" + page,
            JSON.stringify(postjson),
            function (data, status) {
                if (status != "success") { layer.alert("连接服务器失败"); return; }
                $("#d_show").html(data);
            },
            "html");
    }

</script>
