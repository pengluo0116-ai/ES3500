name: "Single file"

on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt update -qq && sudo apt install -y -qq g++
      - run: |
          head -3 src/collector/main.cpp
          g++ -std=c++11 -Wall -c -I src/collector -I include -I include/json -I include/sqlite src/collector/main.cpp -o main.o 2>&1; RC=$?
          echo "EXIT:$RC"
          exit $RC
