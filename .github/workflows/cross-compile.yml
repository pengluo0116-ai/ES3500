name: "Compile Test"

on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt update -qq
          sudo apt install -y -qq g++-arm-linux-gnueabihf
      - run: |
          echo "=== Testing main.cpp ==="
          arm-linux-gnueabihf-g++ -std=c++11 -c -I src/collector -I include -I include/json -I include/sqlite src/collector/main.cpp -o main.o 2>&1 | head -30
          echo "EXIT: $?"
      - run: |
          echo "=== Testing http_server.cpp ==="
          arm-linux-gnueabihf-g++ -std=c++11 -c -I src/collector -I include -I include/json -I include/sqlite src/collector/http_server.cpp -o http.o 2>&1 | head -30
          echo "EXIT: $?"
