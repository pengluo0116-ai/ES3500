name: "Test"

on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt update -qq && sudo apt install -y -qq g++-arm-linux-gnueabihf
      - run: |
          ERR=$(arm-linux-gnueabihf-g++ -std=c++11 -c -I src/collector -I include -I include/json -I include/sqlite src/collector/main.cpp -o main.o 2>&1) || echo "::error file=src/collector/main.cpp::${ERR//$'\n'/%0A}"
