name: "Quick test"

on: [push]

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt update -qq && sudo apt install -y -qq g++-arm-linux-gnueabihf
      - run: echo "=== Testing main.cpp ===" && arm-linux-gnueabihf-g++ -std=c++11 -fsyntax-only -I src/collector -I include -I include/json -I include/sqlite src/collector/main.cpp
      - run: echo "=== Testing http_server.cpp ===" && arm-linux-gnueabihf-g++ -std=c++11 -fsyntax-only -I src/collector -I include -I include/json -I include/sqlite src/collector/http_server.cpp
      - run: echo "=== Testing db_manager.cpp ===" && arm-linux-gnueabihf-g++ -std=c++11 -fsyntax-only -I src/collector -I include -I include/json -I include/sqlite src/collector/db_manager.cpp
      - run: echo "=== Testing json_parser.cpp ===" && arm-linux-gnueabihf-g++ -std=c++11 -fsyntax-only -I src/collector -I include -I include/json -I include/sqlite src/collector/json_parser.cpp
      - run: echo "=== Testing alarm_checker.cpp ===" && arm-linux-gnueabihf-g++ -std=c++11 -fsyntax-only -I src/collector -I include -I include/json -I include/sqlite src/collector/alarm_checker.cpp
