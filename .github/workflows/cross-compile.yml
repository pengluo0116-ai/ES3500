name: "Test native compile"

on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt update -qq && sudo apt install -y -qq g++
      - run: g++ -std=c++11 -c -I src/collector -I include -I include/json -I include/sqlite src/collector/main.cpp -o /dev/null
      - run: g++ -std=c++11 -c -I src/collector -I include -I include/json -I include/sqlite src/collector/http_server.cpp -o /dev/null
      - run: g++ -std=c++11 -c -I src/collector -I include -I include/json -I include/sqlite src/collector/db_manager.cpp -o /dev/null
      - run: g++ -std=c++11 -c -I src/collector -I include -I include/json -I include/sqlite src/collector/json_parser.cpp -o /dev/null
      - run: g++ -std=c++11 -c -I src/collector -I include -I include/json -I include/sqlite src/collector/alarm_checker.cpp -o /dev/null
