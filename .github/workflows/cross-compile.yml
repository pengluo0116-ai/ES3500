name: "Build"

on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++-arm-linux-gnueabihf
          arm-linux-gnueabihf-g++ --version
      - run: |
          file src/collector/main.cpp
          wc -l src/collector/main.cpp
          echo "---COMPILE---"
          arm-linux-gnueabihf-g++ -std=c++11 -c -I src/collector -I include -I include/json -I include/sqlite src/collector/main.cpp -o main.o 2>&1
        continue-on-error: true
      - run: |
          echo "---"
          ls -la main.o 2>/dev/null || echo "No main.o"
