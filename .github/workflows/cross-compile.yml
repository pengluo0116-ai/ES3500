name: "Debug"

on: [push]

jobs:
  debug:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "=== PWD ==="
          pwd
          echo "=== LS ==="
          ls -la
          echo "=== LS src/ ==="
          ls -la src/
          echo "=== LS src/collector/ ==="
          ls -la src/collector/
          echo "=== LS include/ ==="
          ls -la include/
          echo "=== HEADER check ==="
          head -5 src/collector/main.cpp
        shell: bash
