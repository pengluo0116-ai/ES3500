name: Build ES2000 Binaries

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ARM cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-arm-linux-gnueabihf

      - name: Cross-compile collector
        run: |
          cd collector/src
          arm-linux-gnueabihf-g++ -std=c++11 -O2 -Wall \
            -I../../ES1000_ENYI_SERVER/web_cgi/webcgi_set/include \
            -o collector \
            main.cpp http_server.cpp db_manager.cpp json_parser.cpp alarm_checker.cpp \
            -lsqlite3 -ljsoncpp -lpthread -static || {
            echo "Static failed, trying dynamic..."
            arm-linux-gnueabihf-g++ -std=c++11 -O2 -Wall \
              -I../../ES1000_ENYI_SERVER/web_cgi/webcgi_set/include \
              -o collector \
              main.cpp http_server.cpp db_manager.cpp json_parser.cpp alarm_checker.cpp \
              -lsqlite3 -ljsoncpp -lpthread
          }
          file collector
          mkdir -p ../../output/bin
          cp collector ../../output/bin/

      - name: Cross-compile data_api CGI
        run: |
          cd ES1000_ENYI_SERVER/web_cgi/data_api
          arm-linux-gnueabihf-g++ -std=c++11 -O2 -Wall \
            -I../../webcgi_set/include \
            -o data_api.cgi data_api.cpp \
            -lsqlite3 -ljsoncpp
          file data_api.cgi
          mkdir -p ../../../output/bin
          cp data_api.cgi ../../../output/bin/

      - name: Create install script
        run: |
          cat > output/install.sh << 'SCRIPT'
          #!/bin/bash
          # ES2000 一键安装脚本（在 Nano Pi 上以 root 运行）
          set -e
          echo "=== ES2000 安装 ==="

          apt-get update
          apt-get install -y libsqlite3-0 libjsoncpp24 libqt5sql5-sqlite lighttpd

          mkdir -p /root/es2000/{bin,logs,data,www}

          cp bin/collector bin/data_api.cgi /root/es2000/bin/
          chmod +x /root/es2000/bin/*

          # systemd 服务
          cat > /etc/systemd/system/es2000-collector.service << 'EOF'
          [Unit]
          Description=ES2000 Data Collector
          After=network.target
          [Service]
          Type=simple
          ExecStart=/root/es2000/bin/collector
          WorkingDirectory=/root/es2000
          Restart=always
          RestartSec=5
          [Install]
          WantedBy=multi-user.target
          EOF

          systemctl daemon-reload
          systemctl enable es2000-collector
          systemctl start es2000-collector

          echo ""
          echo "=== 安装完成 ==="
          echo "collector: $(systemctl is-active es2000-collector)"
          echo "数据接口: http://$(hostname -I | awk '{print $1}'):9009/"
          echo "Web后台:  http://$(hostname -I | awk '{print $1}')/cgi-bin/data_api.cgi?cmd=list"
          SCRIPT
          chmod +x output/install.sh

      - name: Package
        run: |
          cd output
          tar czf ../es2000-binaries.tar.gz .
          ls -lh ../es2000-binaries.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ES2000-Binaries
          path: es2000-binaries.tar.gz
          retention-days: 90
