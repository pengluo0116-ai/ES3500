name: Build ES2000 Full Image

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-arm-linux-gnueabihf xz-utils kpartx rsync
          # ARM 交叉编译库
          sudo dpkg --add-architecture armhf
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev:armhf libjsoncpp-dev:armhf || true

      - name: Download Armbian
        run: |
          mkdir -p work output
          URL="https://armbian.hosthatch.com/archive/nanopim1plus/archive/Armbian_21.08.1_Nanopim1plus_bullseye_current_5.10.60.img.xz"
          echo "Downloading: $URL"
          curl -L --connect-timeout 30 --max-time 900 -o work/armbian.img.xz "$URL" || {
            echo "hosthatch failed, trying imola..."
            curl -L --connect-timeout 30 --max-time 900 -o work/armbian.img.xz \
              "https://imola.armbian.com/archive/nanopim1plus/archive/Armbian_21.08.1_Nanopim1plus_bullseye_current_5.10.60.img.xz" || {
              echo "FATAL: Cannot download Armbian"
              exit 1
            }
          }
          ls -lh work/armbian.img.xz
          xz -d work/armbian.img.xz
          ls -lh work/armbian.img

      - name: Cross-compile collector
        run: |
          cd collector/src
          # 使用项目自带的 ARM .so 库
          LIB_DIR="../../ES1000_ENYI_SERVER/web_cgi/webcgi_set/lib"
          INC_DIR="../../ES1000_ENYI_SERVER/web_cgi/webcgi_set/include"
          arm-linux-gnueabihf-g++ -std=c++11 -O2 -Wall \
            -I"$INC_DIR" -L"$LIB_DIR" \
            -o collector \
            main.cpp http_server.cpp db_manager.cpp json_parser.cpp alarm_checker.cpp \
            -lsqlite3 -ljsoncpp -lpthread 2>&1
          ls -l collector && file collector
          mkdir -p ../../overlay/root/es2000/bin
          cp collector ../../overlay/root/es2000/bin/

      - name: Cross-compile data_api
        run: |
          cd ES1000_ENYI_SERVER/web_cgi/data_api
          LIB_DIR="../../webcgi_set/lib"
          INC_DIR="../../webcgi_set/include"
          arm-linux-gnueabihf-g++ -std=c++11 -O2 -Wall \
            -I"$INC_DIR" -L"$LIB_DIR" \
            -o data_api.cgi data_api.cpp \
            -lsqlite3 -ljsoncpp 2>&1
          ls -l data_api.cgi && file data_api.cgi
          mkdir -p ../../../overlay/root/es2000/bin
          cp data_api.cgi ../../../overlay/root/es2000/bin/

      - name: Create services and scripts
        run: |
          mkdir -p overlay/etc/systemd/system overlay/root/es2000

          cat > overlay/etc/systemd/system/es2000-collector.service << 'EOF'
          [Unit]
          Description=ES2000 Data Collector
          After=network.target
          [Service]
          Type=simple
          ExecStart=/root/es2000/bin/collector
          WorkingDirectory=/root/es2000
          Restart=always
          RestartSec=5
          [Install]
          WantedBy=multi-user.target
          EOF

          cat > overlay/root/es2000/start.sh << 'EOF'
          #!/bin/bash
          echo "=== ES2000 Init ==="
          mkdir -p /root/es2000/{logs,data}
          systemctl daemon-reload
          systemctl enable es2000-collector
          systemctl start es2000-collector
          echo "Port 9009: $(systemctl is-active es2000-collector)"
          EOF
          chmod +x overlay/root/es2000/start.sh

      - name: Inject into image
        run: |
          IMG="work/armbian.img"
          LOOP=$(sudo losetup -f --show -P "$IMG")
          ROOT_PART="${LOOP}p2"
          sudo mkdir -p /mnt/rootfs
          sudo mount "$ROOT_PART" /mnt/rootfs
          sudo rsync -av overlay/ /mnt/rootfs/
          sudo bash -c "echo '/bin/bash /root/es2000/start.sh' >> /mnt/rootfs/etc/rc.local"
          sudo chmod +x /mnt/rootfs/etc/rc.local
          sudo umount /mnt/rootfs
          sudo losetup -d "$LOOP"

      - name: Package firmware
        run: |
          VERSION=$(date +%Y%m%d-%H%M)
          FW_NAME="ES2000_firmware_${VERSION}.img"
          mv work/armbian.img "output/${FW_NAME}"
          cd output
          xz -1 "${FW_NAME}"
          ls -lh

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ES2000-Firmware-Image
          path: output/*.img.xz
          retention-days: 30
