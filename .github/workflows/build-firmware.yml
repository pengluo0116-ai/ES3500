name: Build ES2000 Auto-Setup Image

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils kpartx rsync

      - name: Download Armbian
        run: |
          mkdir -p work output
          URL="https://armbian.hosthatch.com/archive/nanopim1plus/archive/Armbian_21.08.1_Nanopim1plus_bullseye_current_5.10.60.img.xz"
          curl -L --connect-timeout 30 --max-time 900 -o work/armbian.img.xz "$URL" || {
            curl -L --connect-timeout 30 --max-time 900 -o work/armbian.img.xz \
              "https://imola.armbian.com/archive/nanopim1plus/archive/Armbian_21.08.1_Nanopim1plus_bullseye_current_5.10.60.img.xz" || exit 1
          }
          xz -d work/armbian.img.xz

      - name: Create first-boot auto-setup
        run: |
          mkdir -p overlay/root overlay/etc/systemd/system

          # 首次启动脚本 —— 自动装依赖 + 编译 + 启动
          cat > overlay/root/setup.sh << 'SETUP'
          #!/bin/bash
          echo "=== ES2000 Auto Setup ==="

          # 标记只跑一次
          if [ -f /root/.es2000_done ]; then
            systemctl start es2000-collector
            exit 0
          fi

          echo "Installing dependencies..."
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq g++ make libsqlite3-dev libjsoncpp-dev lighttpd

          SRC=/root/ES2000-master
          mkdir -p /root/es2000/{bin,logs,data}

          # 编译 collector
          echo "Building collector..."
          cd $SRC/collector/src
          g++ -std=c++11 -O2 -Wall \
            -I$SRC/ES1000_ENYI_SERVER/web_cgi/webcgi_set/include \
            -o /root/es2000/bin/collector \
            main.cpp http_server.cpp db_manager.cpp json_parser.cpp alarm_checker.cpp \
            -lsqlite3 -ljsoncpp -lpthread

          # 编译 data_api
          echo "Building data_api..."
          cd $SRC/ES1000_ENYI_SERVER/web_cgi/data_api
          g++ -std=c++11 -O2 -Wall \
            -I$SRC/ES1000_ENYI_SERVER/web_cgi/webcgi_set/include \
            -o /root/es2000/bin/data_api.cgi data_api.cpp \
            -lsqlite3 -ljsoncpp

          chmod +x /root/es2000/bin/*
          systemctl daemon-reload
          systemctl start es2000-collector

          touch /root/.es2000_done
          echo "=== ES2000 Ready. Port 9009 ==="
          SETUP
          chmod +x overlay/root/setup.sh

          # collector 服务
          cat > overlay/etc/systemd/system/es2000-collector.service << 'SVC'
          [Unit]
          Description=ES2000 Data Collector
          After=network.target
          [Service]
          Type=simple
          ExecStart=/root/es2000/bin/collector
          WorkingDirectory=/root/es2000
          Restart=always
          RestartSec=5
          [Install]
          WantedBy=multi-user.target
          SVC

          # setup 服务（首次启动跑一次）
          cat > overlay/etc/systemd/system/es2000-setup.service << 'SVC2'
          [Unit]
          Description=ES2000 First Boot Setup
          After=network.target
          [Service]
          Type=oneshot
          ExecStart=/bin/bash /root/setup.sh
          RemainAfterExit=yes
          [Install]
          WantedBy=multi-user.target
          SVC2

      - name: Copy source into image
        run: |
          mkdir -p overlay/root/ES2000-master
          rsync -a --exclude='.git' --exclude='*.img*' --exclude='*.jpg' \
            collector/ qt_display/ ES1000_ENYI_SERVER/ build/ deploy.sh \
            overlay/root/ES2000-master/

      - name: Inject into image
        run: |
          # 用 parted 精确获取第二个分区起始位置
          SECTOR=$(sudo parted -m work/armbian.img unit s print 2>/dev/null | grep "^2:" | cut -d: -f2 | sed 's/s$//')
          if [ -z "$SECTOR" ]; then
            # fallback: fdisk
            SECTOR=$(sudo fdisk -l work/armbian.img 2>/dev/null | awk '/armbian\.img2/{print $2}')
          fi
          [ -z "$SECTOR" ] && { echo "Cannot find partition 2"; exit 1; }
          OFFSET=$((SECTOR * 512))
          echo "Partition 2: sector=$SECTOR offset=$OFFSET"
          sudo mkdir -p /mnt/rootfs
          sudo mount -o loop,offset=$OFFSET work/armbian.img /mnt/rootfs
          sudo rsync -av overlay/ /mnt/rootfs/
          sudo mkdir -p /mnt/rootfs/etc/systemd/system/multi-user.target.wants
          sudo ln -sf /etc/systemd/system/es2000-setup.service /mnt/rootfs/etc/systemd/system/multi-user.target.wants/es2000-setup.service 2>/dev/null || true
          sudo ln -sf /etc/systemd/system/es2000-collector.service /mnt/rootfs/etc/systemd/system/multi-user.target.wants/es2000-collector.service 2>/dev/null || true
          sudo umount /mnt/rootfs

      - name: Package
        run: |
          VERSION=$(date +%Y%m%d-%H%M)
          FW="ES2000_${VERSION}.img"
          mv work/armbian.img "output/${FW}"
          cd output && xz -1 "${FW}" && ls -lh

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ES2000-Auto-Image
          path: output/*.img.xz
          retention-days: 30
