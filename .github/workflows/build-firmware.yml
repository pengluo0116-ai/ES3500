name: Build ES3500 Image

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt update && sudo apt install -y xz-utils kpartx rsync
      - run: |
          mkdir -p work
          # 每个源重试 3 次
          for attempt in 1 2 3; do
            echo "=== Attempt $attempt ==="
            for u in \
              "https://armbian.tnahosting.net/archive/nanopim1plus/archive/Armbian_21.08.1_Nanopim1plus_bullseye_current_5.10.60.img.xz" \
              "https://mirrors.dotsrc.org/armbian-dl/nanopim1plus/archive/Armbian_21.08.1_Nanopim1plus_bullseye_current_5.10.60.img.xz" \
              "https://armbian.hosthatch.com/archive/nanopim1plus/archive/Armbian_21.08.1_Nanopim1plus_bullseye_current_5.10.60.img.xz" \
              "https://imola.armbian.com/archive/nanopim1plus/archive/Armbian_21.08.1_Nanopim1plus_bullseye_current_5.10.60.img.xz"; do
              echo "Try: $u"
              curl -L --retry 3 --connect-timeout 30 --max-time 600 -o work/base.img.xz "$u" && [ $(stat -c%s work/base.img.xz) -gt 1000000 ] && break 2
              rm -f work/base.img.xz
            done
            [ -f work/base.img.xz ] && break
            sleep 30
          done
          [ -f work/base.img.xz ] || { echo "FATAL: download failed after 3 attempts"; exit 1; }
          xz -d work/base.img.xz
      - name: Prepare overlay
        run: |
          mkdir -p overlay/root/ES3500-master overlay/etc/systemd/system overlay/etc/NetworkManager/system-connections

          # 复制源码
          rsync -aq --exclude='.git' --exclude='*.img*' --exclude='*.zip' --exclude='test' collector/ qt_display/ ES1500_ENYI_SERVER/ deploy.sh install.sh logo/ overlay/root/ES3500-master/

          # collector 服务
          cat > overlay/etc/systemd/system/es3500-collector.service << 'SVC'
          [Unit]
          Description=ES3500 Collector
          After=network.target
          [Service]
          Type=simple
          ExecStart=/root/es2000/bin/collector
          Restart=always
          [Install]
          WantedBy=multi-user.target
          SVC

          # WiFi
          cat > overlay/etc/NetworkManager/system-connections/easyele.nmconnection << 'WIFI'
          [connection]
          id=easyele
          type=wifi
          interface-name=wlan0
          autoconnect=true
          [wifi]
          mode=infrastructure
          ssid=easyele
          [wifi-security]
          key-mgmt=wpa-psk
          psk=JNZQ7572
          [ipv4]
          method=auto
          WIFI
          chmod 600 overlay/etc/NetworkManager/system-connections/easyele.nmconnection

          # 终端支持
          cat > overlay/root/.bashrc << 'RC'
          export TERM=xterm-256color
          alias ll='ls -la'
          RC

          # 首次启动
          cat > overlay/root/init.sh << 'INIT'
          #!/bin/bash
          [ -f /root/.init_ok ] && { systemctl start es3500-collector; exit 0; }
          echo "ES3500 Auto Setup"
          apt-get update -qq && apt-get install -y -qq g++ libsqlite3-dev libjsoncpp-dev espeak
          SRC=/root/ES3500-master
          cd $SRC/src
          g++ -std=c++11 -O2 -I$SRC/web_cgi/webcgi_set/include -I$SRC/web_cgi/webcgi_set/include/sqlite -o collector *.cpp -lsqlite3 -ljsoncpp -lpthread 2>&1 | tail -1
          mkdir -p /root/es2000/bin && cp collector /root/es2000/bin/
          systemctl enable es3500-collector && systemctl start es3500-collector
          touch /root/.init_ok
          echo "ES3500 READY"
          INIT
          chmod +x overlay/root/init.sh
          echo '/bin/bash /root/init.sh &' > overlay/etc/rc.local && chmod +x overlay/etc/rc.local

      - name: Inject
        run: |
          # 用 parted 精确获取分区 2 起始
          SEC=$(sudo parted -m work/base.img unit s print 2>/dev/null | grep "^2:" | cut -d: -f2 | sed 's/s$//')
          [ -z "$SEC" ] && SEC=270336
          OFFSET=$((SEC * 512))
          echo "Partition 2: sector=$SEC offset=$OFFSET"
          LOOP=$(sudo losetup -f --show -o $OFFSET work/base.img)
          sudo mkdir -p /mnt/r
          sudo mount "$LOOP" /mnt/r || { echo "MOUNT FAILED"; sudo losetup -d "$LOOP"; exit 1; }
          sudo rsync -a overlay/ /mnt/r/
          sudo mkdir -p /mnt/r/etc/systemd/system/multi-user.target.wants
          sudo ln -sf /etc/systemd/system/es3500-collector.service /mnt/r/etc/systemd/system/multi-user.target.wants/
          sudo rm -f /mnt/r/etc/systemd/system/multi-user.target.wants/armbian-firstrun*
          sudo umount /mnt/r
          sudo losetup -d "$LOOP"

      - name: Package
        run: |
          FW="ES3500_B$(date +%y%m%d).img"
          mv work/base.img "$FW"
          xz -1 "$FW" && ls -lh "$FW.xz"

      - uses: actions/upload-artifact@v4
        with:
          name: ES3500-Image
          path: "*.img.xz"
          retention-days: 30
