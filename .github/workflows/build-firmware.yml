name: Build ES2000 Firmware Image

on:
  push:
    branches: [master, main]
  workflow_dispatch:  # 手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential g++-arm-linux-gnueabihf \
            libsqlite3-dev:armhf libjsoncpp-dev:armhf \
            qtbase5-dev:armhf libqt5sql5-sqlite:armhf \
            wget xz-utils kpartx qemu-user-static rsync \
            || true
          # 如果 armhf 包不可用，手动安装交叉编译工具
          sudo apt-get install -y \
            g++-arm-linux-gnueabihf \
            wget xz-utils kpartx rsync

      - name: Download Armbian base image
        run: |
          mkdir -p work output
          ARMBIAN_URL="https://fi.mirror.armbian.de/archive/nanopim1plus/archive/Armbian_23.02.2_Nanopim1plus_bullseye_current_5.15.93.img.xz"
          echo "Downloading Armbian..."
          wget -q --show-progress -O work/armbian.img.xz "$ARMBIAN_URL" || {
            echo "Primary mirror failed, trying alternative..."
            wget -q --show-progress -O work/armbian.img.xz \
              "https://armbian.hosthatch.com/archive/nanopim1plus/archive/Armbian_23.02.2_Nanopim1plus_bullseye_current_5.15.93.img.xz"
          }
          xz -d work/armbian.img.xz

      - name: Cross-compile ES2000 Collector
        run: |
          cd collector/src
          arm-linux-gnueabihf-g++ -std=c++11 -O2 -Wall \
            -I../../ES1000_ENYI_SERVER/web_cgi/webcgi_set/include \
            -o collector \
            main.cpp http_server.cpp db_manager.cpp json_parser.cpp alarm_checker.cpp \
            -lsqlite3 -ljsoncpp -lpthread -static 2>&1 || {
            echo "Static link failed, trying dynamic..."
            arm-linux-gnueabihf-g++ -std=c++11 -O2 -Wall \
              -I../../ES1000_ENYI_SERVER/web_cgi/webcgi_set/include \
              -o collector \
              main.cpp http_server.cpp db_manager.cpp json_parser.cpp alarm_checker.cpp \
              -lsqlite3 -ljsoncpp -lpthread
          }
          file collector
          mkdir -p ../../overlay/root/es2000/bin
          cp collector ../../overlay/root/es2000/bin/
          chmod +x ../../overlay/root/es2000/bin/collector

      - name: Cross-compile data_api CGI
        run: |
          cd ES1000_ENYI_SERVER/web_cgi/data_api
          arm-linux-gnueabihf-g++ -std=c++11 -O2 -Wall \
            -I../../webcgi_set/include \
            -o data_api.cgi data_api.cpp \
            -lsqlite3 -ljsoncpp
          file data_api.cgi
          mkdir -p ../../../../overlay/root/es2000/bin
          cp data_api.cgi ../../../../overlay/root/es2000/bin/
          chmod +x ../../../../overlay/root/es2000/bin/data_api.cgi

      - name: Create systemd services
        run: |
          mkdir -p overlay/etc/systemd/system

          cat > overlay/etc/systemd/system/es2000-collector.service << 'EOF'
          [Unit]
          Description=ES2000 Data Collector
          After=network.target
          [Service]
          Type=simple
          ExecStart=/root/es2000/bin/collector
          WorkingDirectory=/root/es2000
          Restart=always
          RestartSec=5
          [Install]
          WantedBy=multi-user.target
          EOF

          cat > overlay/etc/systemd/system/es2000-display.service << 'EOF'
          [Unit]
          Description=ES2000 Display
          After=es2000-collector.service
          [Service]
          Type=simple
          ExecStart=/root/es2000/bin/elevator_display
          Environment=DISPLAY=:0
          Environment=QT_QPA_PLATFORM=linuxfb
          Restart=always
          RestartSec=10
          [Install]
          WantedBy=multi-user.target
          EOF

      - name: Create init script
        run: |
          mkdir -p overlay/root/es2000

          cat > overlay/root/es2000/start.sh << 'EOF'
          #!/bin/bash
          echo "=== ES2000 初始化 ==="
          mkdir -p /root/es2000/logs /root/es2000/data
          systemctl daemon-reload
          systemctl enable es2000-collector
          systemctl start es2000-collector
          echo "collector: $(systemctl is-active es2000-collector)"
          echo "数据接口: http://192.168.1.120:9009/"
          EOF
          chmod +x overlay/root/es2000/start.sh

      - name: Inject overlay into Armbian image
        run: |
          IMG="work/armbian.img"
          echo "Image size: $(ls -lh $IMG | awk '{print $5}')"

          # 挂载 rootfs 分区
          LOOP=$(sudo losetup -f --show -P "$IMG")
          echo "Loop device: $LOOP"

          # 第二个分区是 rootfs
          ROOT_PART="${LOOP}p2"
          sudo mkdir -p /mnt/rootfs
          sudo mount "$ROOT_PART" /mnt/rootfs

          # 同步 overlay
          echo "Syncing overlay..."
          sudo rsync -av overlay/ /mnt/rootfs/

          # 设置首次启动脚本
          sudo bash -c "echo '/bin/bash /root/es2000/start.sh' >> /mnt/rootfs/etc/rc.local"
          sudo chmod +x /mnt/rootfs/etc/rc.local

          # 卸载
          sudo umount /mnt/rootfs
          sudo losetup -d "$LOOP"

      - name: Compress and rename firmware
        run: |
          VERSION=$(date +%Y%m%d-%H%M)
          FW_NAME="ES2000_firmware_${VERSION}.img"
          mv work/armbian.img "output/${FW_NAME}"
          cd output
          xz -1 "${FW_NAME}"
          echo "FIRMWARE=${FW_NAME}.xz" >> $GITHUB_ENV
          ls -lh

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: ES2000-Firmware
          path: output/*.img.xz
          retention-days: 90
