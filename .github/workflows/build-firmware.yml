name: Build ES3500 (Precompiled)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-arm-linux-gnueabihf xz-utils kpartx rsync

      - name: Download Armbian
        run: |
          curl -L --max-time 900 -o work/base.img.xz \
            "https://armbian.hosthatch.com/archive/nanopim1plus/archive/Armbian_21.08.1_Nanopim1plus_bullseye_current_5.10.60.img.xz" || {
            curl -L --max-time 900 -o work/base.img.xz \
              "https://imola.armbian.com/archive/nanopim1plus/archive/Armbian_21.08.1_Nanopim1plus_bullseye_current_5.10.60.img.xz" || exit 1
          }
          xz -d work/base.img.xz

      - name: Mount rootfs as sysroot
        id: sysroot
        run: |
          LOOP=$(sudo losetup -f --show work/base.img)
          sudo partprobe "$LOOP"; sleep 2
          RP="${LOOP}p2"
          [ -e "$RP" ] || { SEC=$(sudo fdisk -l work/base.img|awk '/img2/{print $2}'); sudo losetup -d "$LOOP"; LOOP=$(sudo losetup -f --show -o $((SEC*512)) work/base.img); RP="$LOOP"; }
          sudo mkdir -p /mnt/sysroot
          sudo mount "$RP" /mnt/sysroot
          echo "SYSROOT=/mnt/sysroot" >> $GITHUB_ENV
          echo "LOOP=$LOOP" >> $GITHUB_ENV

          # 在 sysroot 里装 ARM 开发库
          sudo cp /usr/bin/qemu-arm-static /mnt/sysroot/usr/bin/ 2>/dev/null || true
          sudo chroot /mnt/sysroot /bin/bash -c "
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq 2>&1 | tail -1
            apt-get install -y -qq libsqlite3-dev libjsoncpp-dev 2>&1 | tail -1
          " 2>&1 || echo "CHROOT INSTALL FAILED (ignored)"
          sudo rm -f /mnt/sysroot/usr/bin/qemu-arm-static
          ls /mnt/sysroot/usr/lib/arm-linux-gnueabihf/libsqlite3* 2>/dev/null || echo "NO sqlite3 in sysroot"

      - name: Cross-compile collector
        run: |
          arm-linux-gnueabihf-g++ \
            --sysroot=$SYSROOT \
            -std=c++11 -O2 -Wall \
            -I$SYSROOT/usr/include -I$SYSROOT/usr/include/arm-linux-gnueabihf \
            -o collector \
            collector/src/main.cpp \
            collector/src/http_server.cpp \
            collector/src/db_manager.cpp \
            collector/src/json_parser.cpp \
            collector/src/alarm_checker.cpp \
            -lsqlite3 -ljsoncpp -lpthread -lrt \
            -Wl,-rpath-link,$SYSROOT/usr/lib/arm-linux-gnueabihf \
            -Wl,-rpath-link,$SYSROOT/lib/arm-linux-gnueabihf 2>&1
          file collector && echo "COMPILE OK"
          mkdir -p overlay/root/es2000/bin
          cp collector overlay/root/es2000/bin/

      - name: Create services
        run: |
          mkdir -p overlay/etc/systemd/system overlay/root overlay/etc/NetworkManager/system-connections

          cat > overlay/etc/systemd/system/es3500-collector.service << 'SVC'
          [Unit]
          Description=ES3500 Collector
          After=network.target
          [Service]
          Type=simple
          ExecStart=/root/es2000/bin/collector
          Restart=always
          [Install]
          WantedBy=multi-user.target
          SVC

          # WiFi
          cat > overlay/etc/NetworkManager/system-connections/easyele.nmconnection << 'WIFI'
          [connection]
          id=easyele
          type=wifi
          interface-name=wlan0
          autoconnect=true
          [wifi]
          mode=infrastructure
          ssid=easyele
          [wifi-security]
          key-mgmt=wpa-psk
          psk=JNZQ7572
          [ipv4]
          method=auto
          WIFI
          chmod 600 overlay/etc/NetworkManager/system-connections/easyele.nmconnection

          # root 自动登录
          mkdir -p overlay/etc/systemd/system/getty@tty1.service.d
          echo -e "[Service]\nExecStart=\nExecStart=-/sbin/agetty --autologin root --noclear %I \$TERM" > overlay/etc/systemd/system/getty@tty1.service.d/autologin.conf

      - name: Inject + enable
        run: |
          sudo mount "$LOOP" /mnt/sysroot 2>/dev/null || {
            LOOP=$(sudo losetup -f --show work/base.img)
            sudo partprobe "$LOOP"; sleep 2
            RP="${LOOP}p2"
            [ -e "$RP" ] || { SEC=$(sudo fdisk -l work/base.img|awk '/img2/{print $2}'); sudo losetup -d "$LOOP"; LOOP=$(sudo losetup -f --show -o $((SEC*512)) work/base.img); RP="$LOOP"; }
            sudo mount "$LOOP" /mnt/sysroot
          }
          sudo rsync -av overlay/ /mnt/sysroot/
          sudo mkdir -p /mnt/sysroot/etc/systemd/system/multi-user.target.wants
          sudo ln -sf /etc/systemd/system/es3500-collector.service /mnt/sysroot/etc/systemd/system/multi-user.target.wants/
          # 跳过 Armbian 首次设置
          sudo rm -f /mnt/sysroot/etc/systemd/system/multi-user.target.wants/armbian-firstrun* 2>/dev/null || true
          sudo umount /mnt/sysroot
          sudo losetup -d "$LOOP"

      - name: Package
        run: |
          FW="ES3500_v$(date +%y%m%d.%H%M).img"
          mv work/base.img "$FW"
          xz -1 "$FW" && ls -lh "$FW.xz"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ES3500-Final
          path: "*.img.xz"
          retention-days: 30
