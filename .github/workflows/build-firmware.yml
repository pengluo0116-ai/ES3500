name: Build ES2000 Full Image

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils kpartx rsync qemu-user-static

      - name: Download Armbian
        run: |
          mkdir -p work output
          URL="https://armbian.hosthatch.com/archive/nanopim1plus/archive/Armbian_21.08.1_Nanopim1plus_bullseye_current_5.10.60.img.xz"
          curl -L --connect-timeout 30 --max-time 900 -o work/armbian.img.xz "$URL" || {
            curl -L --connect-timeout 30 --max-time 900 -o work/armbian.img.xz \
              "https://imola.armbian.com/archive/nanopim1plus/archive/Armbian_21.08.1_Nanopim1plus_bullseye_current_5.10.60.img.xz" || exit 1
          }
          xz -d work/armbian.img.xz

      - name: Extract rootfs and chroot compile
        run: |
          LOOP=$(sudo losetup -f --show -P work/armbian.img)
          ROOT_PART="${LOOP}p2"
          sudo mkdir -p /mnt/rootfs
          sudo mount "$ROOT_PART" /mnt/rootfs

          # 复制 qemu 到 chroot
          sudo cp /usr/bin/qemu-arm-static /mnt/rootfs/usr/bin/

          # 复制源码到 chroot
          sudo mkdir -p /mnt/rootfs/root/es2000-src
          sudo cp -r collector /mnt/rootfs/root/es2000-src/
          sudo cp -r ES1000_ENYI_SERVER/web_cgi /mnt/rootfs/root/es2000-src/

          # 在 chroot 中安装编译工具并编译
          sudo chroot /mnt/rootfs /bin/bash -c "
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq g++ make libsqlite3-dev libjsoncpp-dev 2>&1 | tail -3

            cd /root/es2000-src/collector/src
            g++ -std=c++11 -O2 -Wall \
              -I/root/es2000-src/ES1000_ENYI_SERVER/web_cgi/webcgi_set/include \
              -o collector \
              main.cpp http_server.cpp db_manager.cpp json_parser.cpp alarm_checker.cpp \
              -lsqlite3 -ljsoncpp -lpthread 2>&1
            echo 'collector build exit code:' \$?
            ls -l collector

            mkdir -p /root/es2000/bin
            cp collector /root/es2000/bin/
          "

          # 编译 data_api
          sudo chroot /mnt/rootfs /bin/bash -c "
            cd /root/es2000-src/ES1000_ENYI_SERVER/web_cgi/data_api
            g++ -std=c++11 -O2 -Wall \
              -I/root/es2000-src/ES1000_ENYI_SERVER/web_cgi/webcgi_set/include \
              -o data_api.cgi data_api.cpp \
              -lsqlite3 -ljsoncpp 2>&1
            echo 'data_api build exit code:' \$?
            ls -l data_api.cgi
            cp data_api.cgi /root/es2000/bin/
          "

          # 复制编译产物出来
          mkdir -p overlay/root/es2000/bin
          sudo cp /mnt/rootfs/root/es2000/bin/* overlay/root/es2000/bin/ 2>/dev/null || true

          sudo umount /mnt/rootfs

      - name: Check binaries
        run: |
          ls -l overlay/root/es2000/bin/
          file overlay/root/es2000/bin/collector 2>/dev/null || echo "collector NOT BUILT"
          file overlay/root/es2000/bin/data_api.cgi 2>/dev/null || echo "data_api NOT BUILT"

      - name: Create services
        run: |
          mkdir -p overlay/etc/systemd/system overlay/root/es2000
          cat > overlay/etc/systemd/system/es2000-collector.service << 'EOF'
          [Unit]
          Description=ES2000 Data Collector
          After=network.target
          [Service]
          Type=simple
          ExecStart=/root/es2000/bin/collector
          WorkingDirectory=/root/es2000
          Restart=always
          RestartSec=5
          [Install]
          WantedBy=multi-user.target
          EOF

          cat > overlay/root/es2000/start.sh << 'EOF'
          #!/bin/bash
          echo "=== ES2000 Init ==="
          mkdir -p /root/es2000/{logs,data}
          systemctl daemon-reload
          systemctl enable es2000-collector
          systemctl start es2000-collector
          echo "Port 9009: $(systemctl is-active es2000-collector)"
          EOF
          chmod +x overlay/root/es2000/start.sh

      - name: Inject into image
        run: |
          LOOP=$(sudo losetup -f --show -P work/armbian.img)
          ROOT_PART="${LOOP}p2"
          sudo mkdir -p /mnt/rootfs
          sudo mount "$ROOT_PART" /mnt/rootfs
          sudo rsync -av overlay/ /mnt/rootfs/
          sudo bash -c "echo '/bin/bash /root/es2000/start.sh' >> /mnt/rootfs/etc/rc.local"
          sudo chmod +x /mnt/rootfs/etc/rc.local
          sudo umount /mnt/rootfs
          sudo losetup -d "$LOOP"

      - name: Package
        run: |
          VERSION=$(date +%Y%m%d-%H%M)
          FW="ES2000_firmware_${VERSION}.img"
          mv work/armbian.img "output/${FW}"
          cd output && xz -1 "${FW}" && ls -lh

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ES2000-Firmware-Image
          path: output/*.img.xz
          retention-days: 30
