name: Build ES3500 Precompiled Image

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt update && sudo apt install -y xz-utils kpartx rsync qemu-user-static

      - name: Download Armbian
        run: |
          mkdir -p work
          curl -L --max-time 900 -o work/base.img.xz \
            "https://armbian.hosthatch.com/archive/nanopim1plus/archive/Armbian_21.08.1_Nanopim1plus_bullseye_current_5.10.60.img.xz" || {
            curl -L --max-time 900 -o work/base.img.xz \
              "https://imola.armbian.com/archive/nanopim1plus/archive/Armbian_21.08.1_Nanopim1plus_bullseye_current_5.10.60.img.xz" || exit 1
          }
          xz -d work/base.img.xz

      - name: Precompile collector in ARM
        run: |
          # 挂载分区
          LOOP=$(sudo losetup -f --show work/base.img)
          sudo partprobe "$LOOP" 2>/dev/null || true; sleep 2
          if [ -e "${LOOP}p2" ]; then RP="${LOOP}p2"; else
            SEC=$(sudo fdisk -l work/base.img|grep "img2"|awk '{print $2}')
            sudo losetup -d "$LOOP"; LOOP=$(sudo losetup -f --show -o $((SEC*512)) work/base.img); RP="$LOOP"
          fi
          sudo mkdir -p /mnt/arm; sudo mount "$RP" /mnt/arm
          sudo cp /usr/bin/qemu-arm-static /mnt/arm/usr/bin/

          # 复制源码进 chroot
          sudo mkdir -p /mnt/arm/root/build
          sudo cp collector/src/*.cpp collector/src/*.h /mnt/arm/root/build/
          sudo cp -r ES1500_ENYI_SERVER/web_cgi/webcgi_set/include /mnt/arm/root/build/ 2>/dev/null || true
          sudo cp -r web_cgi/webcgi_set/include /mnt/arm/root/build/ 2>/dev/null || true

          # 在 ARM 环境里安装依赖 + 编译
          sudo chroot /mnt/arm /bin/bash -c "
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq g++ libsqlite3-dev libjsoncpp-dev 2>&1 | tail -2
            cd /root/build
            INC=/root/build/include
            [ ! -d \$INC ] && INC=/root/build/include || true
            g++ -std=c++11 -O2 -I\$INC -I\$INC/sqlite -o collector \
              main.cpp http_server.cpp db_manager.cpp json_parser.cpp alarm_checker.cpp \
              -lsqlite3 -ljsoncpp -lpthread 2>&1
            mkdir -p /root/es2000/bin
            cp collector /root/es2000/bin/
            echo 'BUILD OK' && ls -l /root/es2000/bin/collector
          " 2>&1 | tail -8

          # 取出编译产物
          mkdir -p output
          sudo cp /mnt/arm/root/es2000/bin/collector output/
          sudo cp /mnt/arm/root/build/collector output/ 2>/dev/null || true
          ls -lh output/
          file output/collector 2>/dev/null || echo "NO BINARY"

          sudo umount /mnt/arm
          sudo losetup -d "$LOOP"

      - name: Prep services
        run: |
          mkdir -p overlay/root/es2000/bin overlay/etc/systemd/system
          cp output/collector overlay/root/es2000/bin/ 2>/dev/null || echo "WARN: no binary"

          cat > overlay/etc/systemd/system/es3500-collector.service << 'SVC'
          [Unit]
          Description=ES3500 Collector
          After=network.target
          [Service]
          Type=simple
          ExecStart=/root/es2000/bin/collector
          Restart=always
          [Install]
          WantedBy=multi-user.target
          SVC

      - name: Inject + enable
        run: |
          LOOP=$(sudo losetup -f --show work/base.img)
          sudo partprobe "$LOOP"; sleep 2
          if [ -e "${LOOP}p2" ]; then RP="${LOOP}p2"; else
            SEC=$(sudo fdisk -l work/base.img|grep "img2"|awk '{print $2}')
            sudo losetup -d "$LOOP"; LOOP=$(sudo losetup -f --show -o $((SEC*512)) work/base.img); RP="$LOOP"
          fi
          sudo mkdir -p /mnt/arm; sudo mount "$RP" /mnt/arm
          sudo rsync -av overlay/ /mnt/arm/
          sudo mkdir -p /mnt/arm/etc/systemd/system/multi-user.target.wants
          sudo ln -sf /etc/systemd/system/es3500-collector.service /mnt/arm/etc/systemd/system/multi-user.target.wants/
          sudo umount /mnt/arm; sudo losetup -d "$LOOP"

      - name: Package
        run: |
          FW="ES3500_precompiled_$(date +%Y%m%d-%H%M).img"
          mv work/base.img "$FW"
          xz -1 "$FW" && ls -lh "$FW.xz"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ES3500-precompiled
          path: "*.img.xz"
          retention-days: 30
