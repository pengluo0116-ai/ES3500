name: Build ES3500 from Scratch

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt update
          sudo apt install -y debootstrap qemu-user-static xz-utils

      - name: Build ARM rootfs
        run: |
          sudo debootstrap --arch=armhf --include=g++,libsqlite3-dev,libjsoncpp-dev,espeak,network-manager,wpasupplicant bullseye /mnt/arm http://deb.debian.org/debian 2>&1 | tail -5
          sudo cp /usr/bin/qemu-arm-static /mnt/arm/usr/bin/

      - name: Cross-compile collector
        run: |
          # 复制源码到 rootfs
          sudo mkdir -p /mnt/arm/root/build
          sudo cp collector/src/*.cpp collector/src/*.h /mnt/arm/root/build/
          sudo cp -r ES1500_ENYI_SERVER/web_cgi/webcgi_set/include /mnt/arm/root/build/
          sudo cp -r web_cgi/webcgi_set/include /mnt/arm/root/build/ 2>/dev/null || true

          # 在 ARM 环境编译
          sudo chroot /mnt/arm /bin/bash -c "
            cd /root/build
            ln -sf /usr/include/jsoncpp/json/ /usr/include/json 2>/dev/null || true
            g++ -std=c++11 -O2 -Iinclude -Iinclude/sqlite -o collector *.cpp -lsqlite3 -ljsoncpp -lpthread 2>&1
            mkdir -p /root/es2000/bin
            cp collector /root/es2000/bin/
            echo BUILD OK
          " 2>&1 | tail -5

          mkdir -p output/bin
          sudo cp /mnt/arm/root/es2000/bin/collector output/bin/ 2>/dev/null
          sudo cp /mnt/arm/root/build/collector output/bin/ 2>/dev/null
          file output/bin/collector 2>/dev/null || echo "NO BINARY"

      - name: Create image
        run: |
          # 创建 2GB 空白镜像
          dd if=/dev/zero of=es3500.img bs=1M count=2048
          # 分区
          sudo parted -s es3500.img mklabel msdos
          sudo parted -s es3500.img mkpart primary ext4 4MiB 100%
          # 格式化
          LOOP=$(sudo losetup -f --show es3500.img)
          sudo partprobe "$LOOP"; sleep 2
          sudo mkfs.ext4 -q "${LOOP}p1" 2>/dev/null || { SEC=8192; sudo losetup -d "$LOOP"; LOOP=$(sudo losetup -f --show -o $((SEC*512)) es3500.img); sudo mkfs.ext4 -q "$LOOP" 2>/dev/null; }
          # 复制 rootfs
          sudo mkdir -p /mnt/img
          sudo mount "$LOOP" /mnt/img
          sudo rsync -a /mnt/arm/ /mnt/img/ --exclude=/proc --exclude=/sys --exclude=/dev
          # 基础配置
          echo "ES3500" | sudo tee /mnt/img/etc/hostname
          sudo bash -c 'cat > /mnt/img/etc/network/interfaces << EOF
          auto lo
          iface lo inet loopback
          EOF'
          # collector 服务
          sudo mkdir -p /mnt/img/etc/systemd/system/multi-user.target.wants
          cat > /tmp/collector.service << 'SVC'
          [Unit]
          Description=ES3500 Collector
          After=network.target
          [Service]
          Type=simple
          ExecStart=/root/es2000/bin/collector
          Restart=always
          [Install]
          WantedBy=multi-user.target
          SVC
          sudo cp /tmp/collector.service /mnt/img/etc/systemd/system/
          sudo ln -sf /etc/systemd/system/collector.service /mnt/img/etc/systemd/system/multi-user.target.wants/
          sudo umount /mnt/img
          sudo losetup -d "$LOOP"

      - name: Package
        run: |
          xz -1 es3500.img && ls -lh es3500.img.xz

      - uses: actions/upload-artifact@v4
        with:
          name: ES3500-scratch
          path: "*.img.xz"
          retention-days: 30
