<script type="text/javascript">

/*禁用滚轮*/
function disabledMouseWheel() {  
  if (document.addEventListener) {  
    document.addEventListener('DOMMouseScroll', scrollFunc, false);  
  }//W3C  
  window.onmousewheel = document.onmousewheel = scrollFunc;//IE/Opera/Chrome  
}  
function scrollFunc(evt) {  
  return false;  
}  
window.onload=disabledMouseWheel; 

/*禁用右键*/
document.oncontextmenu = function(){
    event.returnValue = false;
}

/*禁用选择*/
document.onselectstart = function(){
    event.returnValue = false;
} 

var sbox_list = null;               //设备实时信息对象
var mydev_conf = null;
$(document).ready(function(){
    mydev_conf = new DEV_CONT(); 
    cmd_getDev();
});

/*
        函数名称：QT_load_page

        编写时间：2017-05-27
    */
    function QT_load_page(){
        location.href = "/qtindex.html";
    }

/*控制体类*/
function DEV_CONT(){
    this.serverDate = "2010-01-01 12:00:00";            //系统时间
    this.now_date = 0;                                  //当前系统时间转换成秒数
}

/*
    函数名称：dev_RealUpdate
    函数功能：设备实时信息更新
    传入参数：jsonReal 单台设备的实时信息
    传出数据：无
    注意事项：仅仅更新到实时数组当中，没有直接显示
    编写人员：王凤龙
    编写时间：2015-05-03
*/
DEV_CONT.prototype.dev_RealUpdate = function(realData){
    var obj = null;
    var point = 0x00;
    var _realData = null;

    /*将获取到的实时数据进行格式化*/
    _realData = realData;
    /*判断元素是否存在*/
    if($("#item_" + _realData["Parameters"]["ID"]).length <= 0x00) return;
    obj = $("#item_" + _realData["Parameters"]["ID"]);
    point = obj.find("input:eq(0)").val();  point = ~~point;

    sbox_list.list[point]["real"] = eval('('+ JSON.stringify(_realData) +')');
    return;
}

/*
    函数名称：dev_RealShow
    函数功能：单台设备显示实时数据
    传入参数：_point sbox_list.list下标值
    传出数据：无
    注意事项：无
    编写人员：王凤龙
    编写时间：2015-05-03
*/
DEV_CONT.prototype.dev_RealShow = function(_point){
    /*离线--从未获取到数据*/
    if(sbox_list.list[_point]["real"] == null){ 
        sbox_list.list[_point]["status"] = "离线"; 
        $("#item_" + sbox_list.list[_point]["id"]).css("background-image", "url(/image/map_noline.png)");
        return; 
    }

    /*离线--超时离线*/
    var dev_date = new Date(Date.parse(sbox_list.list[_point]["real"]["Parameters"]["Recv_time"].replace(/-/g, "/"))); 
    var sjc = this.now_date.getTime() - dev_date.getTime();
    if(sjc/1000 > 120){
        sbox_list.list[_point]["status"] = "离线"; 
        $("#item_" + sbox_list.list[_point]["id"]).css("background-image", "url(/image/map_noline.png)");
        return;
    }

    /*故障*/
    if(~~sbox_list.list[_point]["real"]["Alarm"]["Y_N"]){
        sbox_list.list[_point]["status"] = "故障"; 
        $("#item_" + sbox_list.list[_point]["id"]).css("background-image", "url(/image/map_guzhang.png)");
        return;
    }

    /*正常*/
    else{
        sbox_list.list[_point]["status"] = "正常"; 
        $("#item_" + sbox_list.list[_point]["id"]).css("background-image", "url(/image/map_green.png)");
        return;
    }
}

/*
    函数名称：nowDate_scaler
    函数功能：当前系统时间换算成秒数
    传入参数：无
    传出数据：无
    注意事项：无
    编写人员：王凤龙
    编写时间：2015-05-03
*/
DEV_CONT.prototype.nowDate_scaler = function(){
    this.now_date = new Date(Date.parse(this.serverDate.replace(/-/g, "/")));
}

/*
    函数名称：devList_RealCont
    函数功能：设备实时处理
    传入参数：realList
    传出数据：无
    注意事项：无
    编写人员：王凤龙
    编写时间：2015-05-03
*/
DEV_CONT.prototype.devList_RealCont = function(realList){
    realList = eval('('+ realList +')'); 
    /*参数校验*/
    if(realList==null || realList.length<=0x00) return;

    /*将实时数据更新到设备信息数组中*/
    for(var i=0x00; i<realList.length; i++){ 
        try{ this.dev_RealUpdate(realList[i]); }catch(e){}
    }

    /*实时数据更新*/
    this.nowDate_scaler();                                  //更新当前时间
    for(var i=0x00; i<sbox_list.list.length; i++){
        this.dev_RealShow(i);
    }

}

/*地图坐标点类*/
/*
    list中的ITEM
    {
        “id”:"xxx",
        "obj":xxx, 控件
        "x": 0, x坐标
        “y”: 0, y坐标
        "status": 0, 状态 0 正常 1故障 2离线
        "img":"图片颜色"
    }
*/
function map_list(){
    this.list = null;                         //设备地图坐标点
    this.width = 0x00;                      //容器宽度
    this.height = 0x00;                     //容器高度
    this.obj_box = $("#dv_box");            //容器控件
}

function map_load(_jsonList){
    sbox_list = new map_list(); 
    sbox_list.list = _jsonList;
    sbox_list.init();
    sbox_list.item_create_all();
}

/*
    函数名称：cmd_getDev
    函数功能：获取设备信息
    传入参数：无
    传出数据：无
    注意事项：无
    编写人员：王凤龙
    编写时间：2016-10-18
*/
function cmd_getDev() {
    var postJson = {};
    postJson.display = 5;
    var _load = layer.load();

    $.post(
        "cgi-bin/dev.cgi",
        JSON.stringify(postJson),
        function (data, status) {
            layer.close(_load);
            if (status != "success") { layer.alert("连接服务器失败"); return; }
            var temp = eval('(' + data + ')');
            switch (parseInt(temp.error)) {
                case 399: location.href = "login.html"; return;
                case 0: break;
                case 101: layer.alert(temp.data); return;
                default: layer.alert(temp.data); return;
            }
            map_load(temp.data);
            resp_realData();
            QT_checkUpdate_devInfo();
        },
        "html");
}

/*初始化函数*/
map_list.prototype.init = function(){ 
    var img = new Image();
    img.src = "image/map.jpeg";
    this.obj_box.width(img.width);
    this.obj_box.height(img.height);

    this.width = img.width;
    this.height = img.height;

    if($(document.body).width() > this.width){ this.obj_box.css("margin-left", ($(document.body).width() - this.width)/2 + "px" ); }
}

/*
    函数名称：get_item_status_tips
    函数功能：根据sbox_list.list的下标，获取事实状态
    传入参数：_point 下标
    传出数据：html样式字符串
    注意事项：无
    编写人员：王凤龙
    编写时间：2015-05-03
*/
map_list.prototype.get_item_status_tips = function(_point){    
    var obj = this.list[_point];
    var tmp = "";
    tmp += "设备名称：" + obj["name"] + "</br>";
    if(obj["real"] == null){  
        tmp += "设备状态：离线";
        return tmp;
    }

    tmp += "上报时间：" + obj["real"]["Parameters"]["Recv_time"] + "</br>";

    /*运行状态*/
    tmp += "运行状态：";
    tmp += ~~obj["real"]["State"]["DS_DX"] ? "" : "-";
    tmp += obj["real"]["State"]["Lou_Ceng"];
    switch(~~obj["real"]["State"]["status"]){
        case 0: tmp += " 停"; break;
        case 1: tmp += " 上"; break;
        case 2: tmp += " 停"; break;
    }
    tmp += "</br>";

    /*设备状态*/
    if(obj["status"] == "离线" || obj["status"] == "正常"){
        tmp += "设备状态：" + obj["status"];
        return tmp;
    }
    else{
        tmp += "设备状态：故障 </br>";
    }

    /*报警信息*/
    tmp += "报警信息：";
    tmp += ~~obj["real"]["Alarm"]["Kunren"] ? "困人 " : "";
    tmp += ~~obj["real"]["Alarm"]["Power"] ? "断电 " : "";
    tmp += ~~obj["real"]["Alarm"]["UP_Alarm"] ? "冲顶 " : "";
    tmp += ~~obj["real"]["Alarm"]["Down_Alarm"] ? "蹲底 " : "";
    tmp += ~~obj["real"]["Alarm"]["Speeding"] ? "超速 " : "";
    tmp += ~~obj["real"]["Alarm"]["Run_door"] ? "开门走梯 " : "";
    tmp += ~~obj["real"]["Alarm"]["Kaceng"] ? "卡层 " : "";
    tmp += ~~obj["real"]["Alarm"]["Stp_DoorUnopen"] ? "停梯不开门 " : "";
    tmp += ~~obj["real"]["Alarm"]["Stp_DoorUnclose"] ? "停梯不关门 " : "";
    tmp += ~~obj["real"]["Alarm"]["Stp_Reapet"] ? "重复开关门 " : "";
    tmp += ~~obj["real"]["Alarm"]["Slant_lr"] ? "电梯左右倾斜 " : "";
    tmp += ~~obj["real"]["Alarm"]["Slant_fb"] ? "电梯前后倾斜 " : "";
    tmp += ~~obj["real"]["Alarm"]["Speeding"] ? "超速 " : "";
    tmp += ~~obj["real"]["Alarm"]["Voltage"] ? "电池电量低 " : "";
    tmp += ~~obj["real"]["Alarm"]["Electromobile"] ? "电动车入梯 " : "";
    tmp += ~~obj["real"]["Alarm"]["Manual_Alarm"] ? "手动报警 " : "";
    tmp += ~~obj["real"]["Alarm"]["Amplitude"] ? "电梯震动 " : "";
    tmp += ~~obj["real"]["Alarm"]["Maintain"] ? "长期未维保 " : "";
    tmp += "</br>";
    return tmp;
}

/*
    函数名称：item_create_all
    函数功能：将所有的节点显示到地图中
    传入参数：无
    传出数据：无
    注意事项：无
    编写人员：王凤龙
    编写时间：2017-04-28
*/
map_list.prototype.item_create_all = function(){
    for(i=0x00; i<this.list.length; i++){
        this.list[i]["real"] = null;
        this.list[i]["status"] = "离线";

        var tmp = "";
        tmp += '<div id="item_'+ this.list[i]["id"] +'" class="xsq" style="left: '+ this.list[i]["x"] +'px; top: '+ this.list[i]["y"] +'px;">';
        tmp += '<input type="hidden" value="'+ i +'">';
        tmp += '</div>';

        this.obj_box.append(tmp);
    }

    $.each($(".xsq"), function(point, obj){
        $(obj).click(function(){ layer.tips(sbox_list.get_item_status_tips(point), obj); });
        $(obj).dblclick(function(){ 
            play_vedio(sbox_list.list[point]["id"]);
        });
    });
}

        try{
            mydev_conf.serverDate = temp.datetime;

    }
