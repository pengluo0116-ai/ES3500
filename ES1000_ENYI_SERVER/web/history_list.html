<script type="text/javascript">
    $(document).ready(function(){
        cmd_get_ALLAlarmData();         //获取历史故障列表
    });
    
    /*
        函数名称：cmd_get_ALLAlarmData
        函数功能：获取所有设备的某个月份的报警信息
        传入参数：
        传出数据：无 日期 201610
        注意事项：无
        编写人员：王凤龙
        编写时间：2016-10-21
    */
    function cmd_get_ALLAlarmData(){
        var postJson = {};
        postJson.display = 1;
        
        var _load = layer.load();
        $.post(
            "cgi-bin/history_list.cgi",
            JSON.stringify(postJson),
            function (data, status) {
                layer.close(_load);
                if (status != "success") { layer.alert("连接服务器失败"); return; }
                var temp = eval('(' + data + ')');
                switch (parseInt(temp.error)) {
                    case 399: location.href = "login.html"; return;
                    case 0: break;
                    case 401: layer.msg(temp.data); return;
                    default: layer.alert(temp.data); return;
                }

                historyTable_show(temp);
            },
            "html");
    }
    
    /*
        函数名称：historyTable_show
        函数功能：显示获取到的故障历史列表
        传入参数：jsonData
        传出数据：无
        注意事项：无
        编写人员：王凤龙
        编写时间：2017-02-24
    */
    function historyTable_show(jsonData){
        if(jsonData.data==null || jsonData.data.length<=0x00) return;
        jsonData = jsonData.data;

        var tmp = "";
        var obj = $("#alarm_tab"); obj.empty();
        for(var i=0x00; i<jsonData.length; i++){
            tmp = "";
            tmp += '<tr>';
            tmp += '<td class="almtb_tab_td1">'+ jsonData[i].substring(0,4) + '年' + jsonData[i].substring(4,6) + '月' +'</td>';
            tmp += '<td class="almtb_tab_td2"><a href="alarm.html?date='+ jsonData[i] +'">查看</a></td>';
            tmp += '<td class="almtb_tab_td3"><a href="#1" onclick="histroy_download(\''+ jsonData[i] +'\')">下载</a></td>';
            tmp += '</tr>';
            obj.append(tmp);
        }

        Table_LineColor("alarm_tab", "#fff", "#c5dee0", "#f8cd90");
    }
    
    /*
        函数名称：histroy_download
        函数功能：下载指定月份的文件报表
        传入参数：file_date
        传出数据：无
        注意事项：无
        编写人员：王凤龙
        编写时间：2017-02-24
    */
    function histroy_download(file_date){ 
        var postJson = {};
        postJson.display = 2;
        postJson.data = file_date;
        
        var _load = layer.load();
        $.post(
            "cgi-bin/history_list.cgi",
            JSON.stringify(postJson),
            function (data, status) {
                layer.close(_load);
                if (status != "success") { layer.alert("连接服务器失败"); return; }
                var temp = eval('(' + data + ')');
                switch (parseInt(temp.error)) {
                    case 399: location.href = "login.html"; return;
                    case 0: break;
                    case 401: layer.msg(temp.data); return;
                    default: layer.alert(temp.data); return;
                }
                location.href = "download/" + temp.data;
            },
            "html");
    }
</script>
