<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <link href="css/css.css" rel="stylesheet" type="text/css" />
    <script src="js/jquery-1.8.3.min.js" type="text/javascript"></script>
    <script src="js/JS.js" type="text/javascript"></script>
    <script src="js/js_display.js" type="text/javascript"></script>
    <!--[if lt IE 9]>
        <script src="js/json/json2.js" type="text/javascript"></script>
    <![endif]-->
    <script src="js/layer/layer.js" type="text/javascript"></script>
    <script src="js/layer/extend/layer.ext.js" type="text/javascript"></script>
    <style type="text/css">
     html{height:100%}
    body{height:100%;margin:0px;padding:0px; font-family: 微软雅黑;}
    .xsq{ position:absolute; cursor: move; width: 30px; height: 35px; background-image: url("/image/map_green.png"); }
    </style>
</head>
<body>
    <div id="dv_box" style="position:absolute; overflow:hidden;white-space:nowrap;">
        <div id="item" class="xsq"></div>
    </div>
</body>
</html>

<script type="text/javascript">
    var PAGE_OPTION = {
        "map" : null,
        "point" : { "x":0, "y":0},
        "cmd" : {
            "get_map" : 9,              //获取地图信息
            "get_dev" : 10              //获取设备信息
        }
    };

    $(document).ready(function(){
        PAGE_OPTION.map = new MAP();
        PAGE_OPTION.map.start();
    });

    function MAP(){
        this.width = 0x00;
        this.height = 0x00;
        this.obj = $("#dv_box");
    }

    /*
        函数名称：init
        函数功能：地图初始化
        传入参数：img_path   地图路径
        传出数据：无
        注意事项：无
        编写人员：王凤龙
        编写时间：2017-05-25
    */
    MAP.prototype.init = function(img_path){
        var img = new Image();
        img.src = img_path;
        var _load = layer.load();
        img.onload = function(){
            layer.close(_load);
            PAGE_OPTION.map.obj.width(img.width);
            PAGE_OPTION.map.obj.height(img.height);
            PAGE_OPTION.map.width = img.width;
            PAGE_OPTION.map.height = img.height;
            PAGE_OPTION.map.obj.css("background-image", "url("+ img_path +")");

            /*加载坐标点*/
            PAGE_OPTION.map.load_point();
        };
    }

    /*
        函数名称：start
        函数功能：起始函数，用于获取地图图片
        传入参数：无
        传出数据：无
        注意事项：无
        编写人员：王凤龙
        编写时间：2017-05-25
    */
    MAP.prototype.start = function(){
        var postData = {};
        postData.display = PAGE_OPTION.cmd.get_map;

        var _load = layer.load();
        $.post(
                "cgi-bin/dev.cgi",
                JSON.stringify(postData),
                function (data, status) {
                    layer.close(_load);
                    if (status != "success") { layer.alert("连接服务器失败"); return; }
                    var temp = eval('(' + data + ')');
                    switch (parseInt(temp.error)) {
                        case 399: location.href = "login.html"; return;
                        case 0: break;
                        default: layer.alert(temp.data); return;
                    }

                    PAGE_OPTION.map.init( "/upload/" + temp.path);
                },
            "html");
    }

    /*
        函数名称：load_point
        函数功能：加载坐标点
        传入参数：无
        传出数据：无
        注意事项：无
        编写人员：王凤龙
        编写时间：2017-05-25
    */
    MAP.prototype.load_point = function(){
        var id = getQueryString("id");
        if(id=="" || id.length<=0x00){ layer.msg("获取设备信息失败"); return; }

        var postData = {};
        postData.display = PAGE_OPTION.cmd.get_dev;
        postData.id = id;

        var _load = layer.load();
        $.post(
                "cgi-bin/dev.cgi",
                JSON.stringify(postData),
                function (data, status) {
                    layer.close(_load);
                    if (status != "success") { layer.alert("连接服务器失败"); return; }
                    var temp = eval('(' + data + ')');
                    switch (parseInt(temp.error)) {
                        case 399: location.href = "login.html"; return;
                        case 0: break;
                        default: layer.alert(temp.data); return;
                    }

                    if(temp["data"].length <= 0x00){ alert("数据加载有误"); }
                    point_init(temp["data"][0].x, temp["data"][0].y);
                },
            "html");
    }

    /*
        函数名称：point_init
        函数功能：坐标点初始化
        传入参数：x,y
        传出数据：无
        注意事项：无
        编写人员：王凤龙
        编写时间：2017-05-25
    */
    function point_init(x, y){
        $("#item").css({
            "left" : x + "px",
            "top" : y + "px"  
        });

        PAGE_OPTION.point.x = x;
        PAGE_OPTION.point.y = y;
        point_moving();
    }

    /*
        函数名称：point_moving
        函数功能：设置坐标点移动使能
        传入参数：无
        传出数据：无
        注意事项：无
        编写人员：王凤龙
        编写时间：2017-05-25
    */
    function point_moving(){
        var mvdom = document.getElementById("item");
        var obj = $("#item");
        var posX;
        var posY;
        var box_width = PAGE_OPTION.map.width;
        var box_height = PAGE_OPTION.map.heigth;
        mvdom.onmousedown = function (e) { 
            if (!e) e = window.event;  //IE
            posX = e.clientX - parseInt(mvdom.style.left);
            posY = e.clientY - parseInt(mvdom.style.top);
            
            PAGE_OPTION.point.x = posX;
            PAGE_OPTION.point.y = posY;
            window.parent.cont_device_update_point(posX, posY);
            
            document.onmousemove = function (ev) {
                if (ev == null) ev = window.event; //IE

                var client_X = ev.clientX - posX;
                var client_Y = ev.clientY - posY;
                if (client_X <= 0) client_X = 0;
                if (client_Y <= 0) client_Y = 0;

                if (client_X >= PAGE_OPTION.map.width-20) client_X = PAGE_OPTION.map.width-20;
                if (client_Y >= PAGE_OPTION.map.height-20) client_Y = PAGE_OPTION.map.height-20;

                mvdom.style.left = client_X + "px";
                mvdom.style.top = client_Y + "px";

                PAGE_OPTION.point.x = client_X;
                PAGE_OPTION.point.y = client_Y;
                window.parent.cont_device_update_point(client_X, client_Y);
            };
        };
        document.onmouseup = function () {
            document.onmousemove = null;
        };
    }
</script>
