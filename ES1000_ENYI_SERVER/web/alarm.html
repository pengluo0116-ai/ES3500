<script type="text/javascript">
var options = {
    "date" : null,
    "anum" : 0,
    "page" : 0,
    "pnum" : 20
};

$(document).ready(function(){
    try{ options.date = getQueryString("date"); }catch(e){ location.href = "/history_list.html"; } 
    getAlarm_num();
});
    
/*
    函数名称：create_pagePoint
    函数功能：创建分页列表
    传入参数：
                pageNum     总页数
                pnum        显示列表中总页数
                point       初始化页码
    传出数据：
    注意事项：无
    编写人员：王凤龙
    编写时间：2017-06-19
*/
function create_pagePoint(pageNum, pnum, point){
    $.jqPaginator('#pagination', {
        totalPages: pageNum,
        visiblePages: pnum,
        currentPage: point,
        wrapper:'<ul class="pagination"></ul>',
        first: '<li class="first"><a href="javascript:void(0);">首页</a></li>',
        prev: '<li class="prev"><a href="javascript:void(0);">上一页</a></li>',
        next: '<li class="next"><a href="javascript:void(0);">下一页</a></li>',
        last: '<li class="last"><a href="javascript:void(0);">尾页</a></li>',
        page: '<li class="page"><a href="javascript:void(0);">{{page}}</a></li>',
        onPageChange: function (num) {
            getAlarm_pageData(~~num);
        }
    });
}

/*
    函数名称：getAlarm_num
    函数功能：获取报警数量
    传入参数：无
    传出数据：无
    注意事项：无
    编写人员：王凤龙
    编写时间：2017-06-19
*/
function getAlarm_num(){
    var postJson = {};
    postJson.display = 1;
    postJson.alarm_date =options.date;

    var _load = layer.load();
    $.post(
        "cgi-bin/palarm.cgi",
        JSON.stringify(postJson),
        function (data, status) {
            layer.close(_load);
            if (status != "success") { layer.alert("连接服务器失败"); return; }
            var temp = eval('(' + data + ')');
            switch (parseInt(temp.error)) {
                case 399: location.href = "login.html"; return;
                case 0: break;
                case 401: layer.msg(temp.data); return;
                default: layer.alert(temp.data); return;
            }

            options.anum = ~~temp.data;
            if(options.anum <= 0x00){ layer.msg("该月无故障信息"); return; }
            options.page = (options.anum - (options.anum %options.pnum)) /options.pnum + (options.anum % options.pnum > 0 ? 1 : 0);
            create_pagePoint(options.page, 10, 1);
        },
        "html"
    );
}

/*
    函数名称：getAlarm_pageData
    函数功能：获取指定页的信息
    传入参数：pagePoint  页码
    传出数据：无
    注意事项：无
    编写人员：王凤龙
    编写时间：2017-06-19      
*/
function getAlarm_pageData(pagePoint){
    var postJson = {};
    postJson.display = 2;
    postJson.alarm_date =options.date;
    postJson.page = pagePoint - 1;
    postJson.pnum =options.pnum;

    var _load = layer.load();
    $.post(
        "cgi-bin/palarm.cgi",
        JSON.stringify(postJson),
        function (data, status) {
            layer.close(_load);
            if (status != "success") { layer.alert("连接服务器失败"); return; }
            var temp = eval('(' + data + ')');
            switch (parseInt(temp.error)) {
                case 399: location.href = "login.html"; return;
                case 0: break;
                case 401: layer.msg(temp.data); return;
                default: layer.alert(temp.data); return;
            }

            alarmData_show(temp.data);
        },
        "html"
    );
}
    
/*
    函数功能：alarmData_show
    函数功能：展示报警信息
    传入参数：_jsonData
    传出数据：无
    注意事项：无
    编写人员：王凤龙
    编写时间：2016-10-21
*/
function alarmData_show(_jsonData){
    /*参数校验*/
    if(_jsonData==null || _jsonData.length<=0x00) return;

    var tabobj = $("#alrm_list")

    tabobj.empty();

    for(var i=0x00; i<_jsonData.length; i++){
        switch(~~_jsonData[i]["status"]){
            case 1: _jsonData[i]["status"]  = "上"; break;
            case 2: _jsonData[i]["status"]  = "下"; break;
            default: _jsonData[i]["status"] = "停";
        }

        _jsonData[i]["people"] = ~~_jsonData[i]["people"] > 0 ? "有人" : "没人";

        var alarmStr = "";
        alarmStr += ~~_jsonData[i]["kunren"]          > 0 ? "困人&nbsp" : "";
        alarmStr += ~~_jsonData[i]["power"]           > 0 ? "掉电&nbsp" : "";
        alarmStr += ~~_jsonData[i]["up_alarm"]        > 0 ? "冲顶&nbsp" : "";
        alarmStr += ~~_jsonData[i]["down_alarm"]      > 0 ? "蹲底&nbsp" : "";
        alarmStr += ~~_jsonData[i]["speeding"]        > 0 ? "超速&nbsp" : "";
        alarmStr += ~~_jsonData[i]["run_door"]        > 0 ? "开门走梯&nbsp" : "";
        alarmStr += ~~_jsonData[i]["kaceng"]          > 0 ? "卡层&nbsp" : "";
        alarmStr += ~~_jsonData[i]["stp_doorunopen"]  > 0 ? "停梯不开门&nbsp" : "";
        alarmStr += ~~_jsonData[i]["stp_doorunclose"] > 0 ? "停梯不关门&nbsp" : "";
        alarmStr += ~~_jsonData[i]["stp_reapet"]      > 0 ? "重复开关门&nbsp" : "";
        alarmStr += ~~_jsonData[i]["amplitude"]       > 0 ? "电梯震动&nbsp" : "";
        alarmStr += ~~_jsonData[i]["electromobile"]   > 0 ? "电动车入梯&nbsp" : "";
        alarmStr += ~~_jsonData[i]["manaual_alarm"]   > 0 ? "手动报警&nbsp" : "";
        alarmStr += ~~_jsonData[i]["voltage"]         > 0 ? "电池电压低&nbsp" : "";
        alarmStr += ~~_jsonData[i]["slant_fb"]        > 0 ? "电梯前后倾斜&nbsp" : "";
        alarmStr += ~~_jsonData[i]["slant_lr"]        > 0 ? "电梯左右倾斜&nbsp" : "";
        alarmStr += ~~_jsonData[i]["maintain"]        > 0 ? "长期未维保&nbsp" : "";
        alarmStr += ~~_jsonData[i]["power_down"]      > 0 ? "外部掉电" : "";

        var tmp = "";
        tmp += '<tr>';
        tmp += '<td class="alm_td1">'+ _jsonData[i]["dev_id"] +'</td>';
        tmp += '<td class="alm_td2">'+ _jsonData[i]["dev_name"] +'</td>';
        tmp += '<td class="alm_td3">';
        if(~~_jsonData[i]["ds_dx"]==0){ tmp += "地下 / "; } else{ tmp += "地上 / "; }
        tmp += _jsonData[i]["lou_ceng"] +'</td>';
        tmp += '<td class="alm_td4">'+ _jsonData[i]["status"] +'</td>';
        tmp += '<td class="alm_td4">'+ _jsonData[i]["people"] +'</td>';
        tmp += '<td class="alm_td5" style="color: red;">'+ alarmStr +'</td>';
        tmp += '<td class="alm_td6">'+ _jsonData[i]["time"] +'</td>';
        tmp += '</tr>';

        tabobj.append(tmp);
    }

    Table_LineColor("alrm_list", "#fff", "#c5dee0", "#f8cd90");
}
    
</script>
